name: Publish pet release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-version.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(tr -d '\r\n' < .github/release-version.txt)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          git checkout --detach "$tag"
      - name: Package pet
        run: |
          mkdir -p dist
          python -m zipfile -c dist/ikithefox-pet.zip pet.json spritesheet.webp
          python -m zipfile -t dist/ikithefox-pet.zip
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/ikithefox-pet.zip --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" dist/ikithefox-pet.zip \
              --verify-tag --latest \
              --title "IKITheFox $RELEASE_TAG" \
              --notes-file .github/RELEASE_NOTES.md
          fi
